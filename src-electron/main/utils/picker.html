<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选择屏幕/窗口</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1e1e1e;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  .container { display: flex; flex-direction: column; height: 100vh; }
  .header {
    padding: 12px 16px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .title { font-weight: 600; font-size: 15px; }
  .actions { display: flex; gap: 8px; }
  .btn {
    padding: 6px 14px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #e6e6e6;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn:hover { background: #333; }
  .grid {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: #2a2a2a;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
    color: inherit;
    font: inherit;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
  }
  .card:hover { border-color: #3a7afe; background: #303030; }
  .card .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 12px;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; min-width: 0; }
  .card .icon { width: 16px; height: 16px; flex-shrink: 0; border-radius: 3px; }
  .card .name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
  }
  .empty { flex: 1; display: none; align-items: center; justify-content: center; color: #888; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">选择屏幕/窗口</div>
    <div class="actions">
      <button type="button" class="btn" id="cancelBtn">取消</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有可用源</div>
</div>
<script>
  (function () {
    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');
    var cancelBtn = document.getElementById('cancelBtn');

    cancelBtn.addEventListener('click', function () { window.pickerAPI.cancel(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { window.pickerAPI.cancel(); }
    });

    window.pickerAPI.onSources(function (sources) {
      if (!sources || sources.length === 0) {
        empty.style.display = 'flex';
        grid.style.display = 'none';
        return;
      }
      for (var i = 0; i < sources.length; i++) {
        var s = sources[i];
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        card.addEventListener('click', (function (id) {
          return function () { window.pickerAPI.select(id); };
        })(s.id));

        var thumb = document.createElement('div');
        thumb.className = 'thumb';
        if (s.thumbnailDataUrl) {
          var img = document.createElement('img');
          img.alt = '';
          img.src = s.thumbnailDataUrl;
          thumb.appendChild(img);
        } else {
          thumb.textContent = '无预览';
        }
        card.appendChild(thumb);

        var meta = document.createElement('div');
        meta.className = 'meta';
        if (s.appIconDataUrl) {
          var icon = document.createElement('img');
          icon.className = 'icon';
          icon.alt = '';
          icon.src = s.appIconDataUrl;
          meta.appendChild(icon);
        }
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = s.name;
        meta.appendChild(name);
        card.appendChild(meta);

        grid.appendChild(card);
      }
    });
  })();
</script>
</body>
</html>
